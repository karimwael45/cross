name: iOS IPA

on:
  push:
    branches: [main, CP-5-fix]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'

      - run: flutter pub get

      - name: Fix iOS minimum version
        run: |
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 13.0/IPHONEOS_DEPLOYMENT_TARGET = 15.0/g' ios/Runner.xcodeproj/project.pbxproj

      - name: Install pods
        run: |
          cd ios && pod install

      - name: Build with xcodebuild
        run: |
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/ios/derived \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Package IPA
        run: |
          APP_PATH=$(find build/ios/derived -name "Runner.app" -type d | grep -v "Tests" | head -1)
          echo "Found: $APP_PATH"
          ls "$APP_PATH/Info.plist"
          mkdir Payload
          cp -r "$APP_PATH" Payload/Runner.app
          zip -qr Rythmify.ipa Payload
          ls -lh Rythmify.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Rythmify-ipa
          path: Rythmify.ipa
