name: rythmify
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^8.0.0
  http: ^1.2.0
  http_parser: ^4.0.2
  mime: ^1.0.5
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  flutter_staggered_grid_view: ^0.7.0
  socket_io_client: ^2.0.3
  dynamic_app_icon_flutter_plus: ^0.0.1
  flutter_web_auth_2: ^4.0.0   # handles the browser + deep link callback
  crypto: ^3.0.3                # for PKCE code challenge generation
  home_widget: ^0.7.0           # home screen widget bridge (Flutter ↔ Android AppWidget)

  

  # State Management & Dependency Injection
  flutter_riverpod: ^3.2.1
  equatable: ^2.0.8
  rxdart: ^0.28.0

  # Profile
  image_picker: ^1.1.2
  share_plus: ^10.1.2

  font_awesome_flutter: ^11.0.0
  
# Authentication
  dartz: ^0.10.1
  sign_in_with_apple: ^6.1.1
  firebase_core: ^3.8.0
  google_sign_in: ^6.2.1
  firebase_auth: ^5.3.1
  # Navigation & Routing
  go_router: ^16.1.0

  # Database
  supabase_flutter: ^2.12.0

  # Audio Engine
  just_audio: ^0.10.5
  just_audio_windows: ^0.2.2
  audio_service: ^0.18.18

  # UI & Design
  flutter_svg: ^2.2.3
  google_fonts: ^8.0.2
  cached_network_image: ^3.4.1  # or consider "cached_network_image_ce"
  shimmer: ^3.0.0

  # Local Storage
  shared_preferences: ^2.3.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  url_launcher: ^6.3.2
  web_socket_channel: ^3.0.3
  mocktail: ^1.0.4
  flutter_native_splash: ^2.4.7
  flutter_chrome_cast: ^1.2.6
  firebase_messaging: ^15.2.10
  flutter_local_notifications: ^21.0.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  mockito: ^5.5.0
  flutter_launcher_icons: ^0.14.1
  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.3
  build_runner: ^2.11.1
  riverpod_lint: ^3.1.3
  flutter_driver:
    sdk: flutter
  fake_async: ^1.3.3

  
  

flutter:
  # Defining assets location
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
    - assets/mocks/
    - assets/audio/



flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#121212"
  adaptive_icon_foreground: "assets/icons/logo.png"

# The engine splash screen
flutter_native_splash:
  color: "#121212"
  image: "assets/icons/logo.png"
  brand: "assets/icons/logo.png"
  color_dark: "#121212"
  android: true
  ios: true

  android_12:
    color: "#121212"
    image: "assets/icons/logo.png"
    icon_background_color: "#121212"
